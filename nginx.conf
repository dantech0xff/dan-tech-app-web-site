# Serves the static export (trailingSlash: true): /about redirects to /about/,
# which serves about/index.html; misses get 404.html with status 404.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Text files such as llms.txt carry non-ASCII letters (Kim Tài); say so, or some readers guess the wrong encoding.
    charset utf-8;

    # Behind Traefik (and possibly Cloudflare) the container never knows the public
    # host or port, so slash redirects stay relative: "Location: /about/".
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Content-hashed bundles and the icon and pixel fonts never change in place (a new font file gets a new name).
    location ~ ^/(_next/static|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A miss is never cached, by a CDN or a browser: a file requested just before its deploy finished would stay "not
    # found" after it exists (Cloudflare keeps a 404 for about 3 minutes and passes max-age on to browsers).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
}
